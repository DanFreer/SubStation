name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        # Project site URL: https://danfreer.github.io/SubStation/
        run: npm run build
        env:
          VITE_BASE_PATH: /SubStation/

      # Guard against shipping the Vite source index (blank white screen on Pages).
      # Built HTML must reference /SubStation/assets/*.js — never /src/main.tsx.
      - name: Verify Pages base path
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q '/SubStation/assets/' dist/index.html
          if grep -qE 'src="/src/main\.tsx"|src="/src/main\.jsx"' dist/index.html; then
            echo '::error::dist/index.html still points at Vite source entry — production build failed'
            cat dist/index.html
            exit 1
          fi
          echo 'OK: production index uses /SubStation/ asset paths'
          cat dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
